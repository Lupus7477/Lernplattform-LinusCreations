[package]
name = "lernpfad-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
ureq.workspace = true
sha2.workspace = true
llama-cpp-2 = { workspace = true, features = ["common"] }

# GPU-Backend je Plattform (Features werden pro Ziel zusammengeführt)
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
llama-cpp-2 = { workspace = true, features = ["common", "vulkan", "openmp"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
llama-cpp-2 = { workspace = true, features = ["common", "metal"] }

[target.'cfg(target_os = "android")'.dependencies]
llama-cpp-2 = { workspace = true, features = ["common", "android-shared-stdcxx"] }
