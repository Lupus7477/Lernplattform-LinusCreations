[workspace]
members = ["core", "src-tauri", "server"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"

# Gemeinsame Versionen: Ein Update gilt für alle Crates (zwei llama-cpp-sys-Versionen ließen sich nicht bauen)
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.42"
ureq = "3"
sha2 = "0.10"
llama-cpp-2 = { version = "0.1.161", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Sampling-Schleife läuft pro Token über ~250k Kandidaten: auch im Entwicklungs-Build optimieren
[profile.dev.package.llama-cpp-2]
opt-level = 3
[profile.dev.package.lernpfad-core]
opt-level = 2
# Passwort-Hashing ist absichtlich teuer; im Entwicklungs-Build sonst sekundenlang
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
