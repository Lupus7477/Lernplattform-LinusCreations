[package]
name = "lernpfad-server"
version = "0.3.0"
edition = "2021"
description = "Eigener Lernpfad-Server: Web-App, Konten und geteilte Kurse, KI auf dem Server"

[dependencies]
lernpfad-core = { path = "../core" }
rusqlite = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
argon2 = "0.5"
sha2 = "0.10"
getrandom = "0.3"
