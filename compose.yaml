services:
  lernpfad:
    build: .
    image: lernpfad
    init: true  # reicht SIGTERM weiter: Neustarts beim Deploy sofort statt nach 10 s Zwangsstopp
    ports:
      - "8443:8443"
    volumes:
      - lernpfad-data:/data
    restart: unless-stopped
    logging:
      options:  # Docker hält Logs sonst unbegrenzt
        max-size: "10m"
        max-file: "3"
    # Zeitzone für Streak, Tagesziel und Kalender (Standard im Image: Europe/Berlin)
    # environment:
    #   TZ: Europe/Vienna
    # Weitere Namen fürs Zertifikat (z. B. Tailscale) und GPU per Vulkan, beides optional:
    # command: ["--host", "pc.tailnet.ts.net"]
    # devices:
    #   - /dev/dri:/dev/dri

volumes:
  lernpfad-data:
