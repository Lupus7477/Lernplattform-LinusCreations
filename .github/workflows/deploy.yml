# Jeder Push auf main: Image auf GitHub bauen und auf den eigenen Server spielen.
# Der Server baut nichts selbst, er lädt nur das fertige Image (siehe deploy.sh).
# Secrets (Repo → Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         IP oder Name des Servers
#   DEPLOY_KEY          privater SSH-Schlüssel, der auf dem Server nur deploy.sh starten darf
#   DEPLOY_KNOWN_HOSTS  Host-Schlüssel des Servers (Schutz gegen falschen Server)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: lernpfad
          outputs: type=docker,dest=/tmp/lernpfad.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Auf den Server spielen
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Der richtige Schlüssel ignoriert diesen Befehl und startet deploy.sh (Zwangsbefehl).
          # Ist DEPLOY_KEY ein normaler Schlüssel, bricht es hier ab, statt das Image in eine Shell zu schieben.
          gzip -c /tmp/lernpfad.tar | ssh -o ServerAliveInterval=30 "root@$HOST" \
            'echo "DEPLOY_KEY ist nicht der eingeschränkte Deploy-Schlüssel (siehe README)" >&2; exit 1'
