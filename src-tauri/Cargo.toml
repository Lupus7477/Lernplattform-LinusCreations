[package]
name = "lernplattform"
version = "0.3.0"
edition = "2021"

[lib]
name = "lernplattform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
lernpfad-core = { path = "../core" }
tauri = { version = "2.12", features = [] }
# Links (Fehler melden, Projekt) im System-Browser; Lern-Erinnerung
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde_json = "1"
ureq = "3"
sha2 = "0.10"
